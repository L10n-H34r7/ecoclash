<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Ecoclash</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --text-primary: #1a2e1a;
      --accent: #2d6a2d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0d1a0d;
        --text-primary: #e8f0e8;
        --accent: #6ab86a;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 6rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    p {
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 0.9;
    }

    .leaf {
      display: inline-block;
      animation: sway 3s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><span class="leaf">🍃</span></div>
    <h1>Page Not Found</h1>
    <p>Oops! The page you're looking for has wandered off into the forest...</p>
    <a href="/">← Return to Home</a>
  </div>
</body>
</html>
